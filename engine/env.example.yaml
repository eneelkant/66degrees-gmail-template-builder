# Copy this file to env.yaml and fill it in. env.yaml is never committed.
# Used by:  gcloud run deploy ... --env-vars-file env.yaml

# ---- Google Cloud ----
PROJECT_NUMBER: "123456789012"          # Google Cloud project number (not the id)
OAUTH_CLIENT_ID: "1234567890-abc.apps.googleusercontent.com"   # the add-on's OAuth client (see docs/setup.md)
IMAGE_BUCKET: "your-image-bucket"       # public-read Cloud Storage bucket for the image library
FIRESTORE_DB: "templates"               # Firestore database id

# ---- Who can use it ----
ALLOWED_DOMAIN: "66degrees.com"         # only accounts on this Google Workspace domain
ADMIN_GROUP: "your-admin-group@66degrees.com"   # Google Group whose members can build and publish
# Optional safety net if the group check cannot be reached (comma separated):
# ADMIN_EMAILS: "first.last@66degrees.com,second.person@66degrees.com"

# ---- Brand (all optional; these are the 66degrees defaults) ----
APP_NAME: "66° Template Gallery"
BRAND_NAME: "66degrees"                 # used in new header and footer rows
BRAND_WEBSITE: "https://www.66degrees.com"
BRAND_LOGO_URL: "/assets/logo-mark.png" # small square logo in the editor's top band
BRAND_INK: "#040A1B"                    # Night Blue: top band, text, header rows
BRAND_ACCENT: "#0052FF"                 # 66° Blue: buttons, links, selection
BRAND_SOFT: "#B3C5D0"                   # Shark Grey: footer rows
BRAND_PAGE: "#F7F7F2"                   # page background
